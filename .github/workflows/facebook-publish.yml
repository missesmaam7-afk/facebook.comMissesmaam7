name: Facebook Photo Publisher

on:
  workflow_dispatch:
  schedule:
    # 10:00, 15:00, 19:00 India Standard Time (UTC+5:30).
    - cron: "30 4,9,13 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-photo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate one AI photo and caption (skips if OPENAI_API_KEY is not configured)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: "gpt-image-1-mini"
          OPENAI_TEXT_MODEL: "gpt-4.1-mini"
        run: python scripts/generate_content.py

      - name: Publish next queued photo
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: "v26.0"
        run: python scripts/publish_next.py

      - name: Persist queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue/posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Facebook publishing queue state"
            git push
          else
            echo "Queue unchanged; nothing to commit."
          fi
