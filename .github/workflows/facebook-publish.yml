
name: Facebook Photo Publisher

run-name: Facebook Publisher - ${{ github.event_name }}

on:
  workflow_dispatch:

  schedule:
    # 10:00 AM, 3:00 PM and 7:00 PM IST
    - cron: "30 4,9,13 * * *"

permissions:
  contents: write

concurrency:
  group: facebook-photo-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and Publish Facebook Photo
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FACE_REFERENCE_IMAGE_BASE64: ${{ secrets.FACE_REFERENCE_IMAGE_BASE64 }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required = [
              "POLLINATIONS_API_KEY",
              "FACE_REFERENCE_IMAGE_BASE64",
              "FACEBOOK_PAGE_ID",
              "FACEBOOK_PAGE_ACCESS_TOKEN",
          ]
          missing = [key for key in required if not os.getenv(key, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          pollinations_key = os.getenv("POLLINATIONS_API_KEY", "").strip()
          if not pollinations_key.startswith("sk_"):
              raise SystemExit("POLLINATIONS_API_KEY must be a Pollinations server-side secret key beginning with sk_. Update the repository secret; never print or commit the key.")
          print("All required secrets are present; Pollinations key format looks correct.")
          PY

      - name: Generate reference-guided AI portrait
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FACE_REFERENCE_IMAGE_BASE64: ${{ secrets.FACE_REFERENCE_IMAGE_BASE64 }}
        run: python scripts/generate_content.py

      - name: Publish photo to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_API_VERSION: "v26.0"
        run: python scripts/publish_next.py

      - name: Save queue and generated images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add queue/posts.json assets/queue/

          if ! git diff --cached --quiet; then
            git commit -m "Save Facebook publishing queue and generated image"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No queue or image changes to save."
          fi
